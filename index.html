<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12284a" />
    <meta name="description" content="Overzicht van komende OGG-diensten." />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <link rel="stylesheet" href="style.css" />
    <title>OGG – Komende diensten</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#diensten" aria-label="OGG komende diensten"><strong>OGG</strong><span>Komende diensten</span></a>
        <button class="icon-button" id="theme-toggle" aria-label="Donkere modus inschakelen" title="Donkere modus">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.6 15.8A8.2 8.2 0 0 1 8.2 3.4a8.2 8.2 0 1 0 12.4 12.4Z"/></svg>
        </button>
      </header>

      <section class="toolbar" aria-label="Diensten zoeken en vernieuwen">
        <label class="search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.2"/><path d="m16 16 4.2 4.2"/></svg><input id="search" type="search" placeholder="Zoek gemeente of voorganger" autocomplete="off" /></label>
        <button class="icon-button" id="refresh" aria-label="Diensten vernieuwen" title="Vernieuwen"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 1.1 4.1"/><path d="M20 4v7h-7"/></svg></button>
      </section>

      <p id="status" class="status" role="status" aria-live="polite">Diensten laden…</p>
      <section id="services" class="services" aria-live="polite"></section>
      <section id="empty-state" class="empty-state" hidden><h1>Geen diensten gevonden</h1><p>Pas je zoekopdracht aan of vernieuw het overzicht.</p></section>
    </main>

    <nav class="bottom-nav" aria-label="Hoofdnavigatie">
      <button class="nav-item active" data-view="all"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg><span>Diensten</span></button>
      <button class="nav-item" data-view="favorites"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.8 8.6c0 5-8.8 10.3-8.8 10.3S3.2 13.6 3.2 8.6a4.6 4.6 0 0 1 8.8-1.9 4.6 4.6 0 0 1 8.8 1.9Z"/></svg><span>Favorieten</span></button>
      <button class="nav-item" id="install" hidden><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span>Installeren</span></button>
    </nav>
    <template id="service-template">
      <article class="service">
        <time class="date-marker"></time>
        <div class="service-content">
          <div class="service-heading"><div><h2></h2><p class="metadata"></p></div><button class="favorite" aria-label="Aan favorieten toevoegen"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.8 8.6c0 5-8.8 10.3-8.8 10.3S3.2 13.6 3.2 8.6a4.6 4.6 0 0 1 8.8-1.9 4.6 4.6 0 0 1 8.8 1.9Z"/></svg></button></div>
          <span class="leesdienst" hidden>Leesdienst</span>
          <details class="liturgy"><summary>Liturgie</summary><p></p></details>
          <a class="livestream" target="_blank" rel="noopener"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7V5Z"/></svg>Livestream</a>
        </div>
      </article>
    </template>
    <script src="config.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
